<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the safe-area insets resolve on notched iPhones (§5.13) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- ponytail: static, so the chrome stays brand-blue even after a user toggles
         to dark. Matching it to the toggle needs JS on every theme change; the
         default theme is light, so this is right for everyone who never toggles. -->
    <meta name="theme-color" content="#173F8C" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Lavadero Berazategui</title>
    <!--
      Applies the theme BEFORE first paint. Doing this from React instead would
      paint the light theme for a frame and then flip — the white flash every
      dark-mode user notices. Blocking and inline on purpose: a deferred or
      external script runs too late to help. Key must match THEME_KEY in
      components/useTheme.ts.

      Light is the default: dark is opt-in via the toggle, never inferred from
      the OS. Only an explicit stored 'dark' turns it on.
    -->
    <script>
      (function () {
        try {
          document.documentElement.classList.toggle(
            'dark', localStorage.getItem('theme') === 'dark');
        } catch (e) { /* private mode: fall back to the light default */ }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-brand/20 selection:text-foreground">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
